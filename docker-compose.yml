services:
  postgres:
    image: postgres:16-alpine
    container_name: dexline-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dexline
      POSTGRES_PASSWORD: dexline_dev_password
      POSTGRES_DB: dexline_store
    ports:
      - "5432:5432"
    volumes:
      - dexline_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexline -d dexline_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dexline_postgres_data:
